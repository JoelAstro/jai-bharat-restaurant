<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf7f0" />
      <stop offset="100%" stop-color="#f0ebe0" />
    </linearGradient>
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#991b1b" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#gridPattern)" />

  <!-- Outer Decorative Border -->
  <rect x="24" y="24" width="752" height="552" rx="20" fill="none" stroke="#d5c7b3" stroke-width="2" stroke-dasharray="6 6" />
  <rect x="36" y="36" width="728" height="528" rx="16" fill="none" stroke="#991b1b" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Central Illustration Container -->
  <g transform="translate(400, 240)">
    <!-- Architectural Building Silhouette -->
    <!-- Base Plate -->
    <rect x="-140" y="80" width="280" height="8" rx="4" fill="#991b1b" fill-opacity="0.7" />
    <rect x="-160" y="88" width="320" height="10" rx="5" fill="#7f1d1d" />

    <!-- Main Hall -->
    <rect x="-120" y="-30" width="240" height="110" rx="4" fill="#ffffff" stroke="#c99a4c" stroke-width="2" />

    <!-- Pillars -->
    <rect x="-105" y="-20" width="16" height="100" rx="3" fill="#faf7f0" stroke="#d5c7b3" stroke-width="1.5" />
    <rect x="-45" y="-20" width="16" height="100" rx="3" fill="#faf7f0" stroke="#d5c7b3" stroke-width="1.5" />
    <rect x="29" y="-20" width="16" height="100" rx="3" fill="#faf7f0" stroke="#d5c7b3" stroke-width="1.5" />
    <rect x="89" y="-20" width="16" height="100" rx="3" fill="#faf7f0" stroke="#d5c7b3" stroke-width="1.5" />

    <!-- Central Grand Entrance Doorway -->
    <path d="M -20,80 L -20,25 C -20,10 20,10 20,25 L 20,80 Z" fill="#991b1b" fill-opacity="0.85" />
    <circle cx="0" cy="45" r="3" fill="#ffd700" />

    <!-- Restaurant Canopy / Awning -->
    <polygon points="-135,-30 135,-30 150,-10 -150,-10" fill="#991b1b" />
    <polygon points="-125,-10 125,-10 120,-3 -120,-3" fill="#ffd700" fill-opacity="0.8" />

    <!-- Traditional Pediment / Roof Crown -->
    <polygon points="0,-95 130,-30 -130,-30" fill="#faf7f0" stroke="#991b1b" stroke-width="2" />
    <polygon points="0,-85 110,-35 -110,-35" fill="none" stroke="#c99a4c" stroke-width="1.5" />

    <!-- Ornamental Finial / Kalash -->
    <circle cx="0" cy="-105" r="7" fill="#c99a4c" />
    <polygon points="0,-120 4,-108 -4,-108" fill="#c99a4c" />

    <!-- Camera / Photo Badge Overlay -->
    <circle cx="95" cy="45" r="30" fill="#991b1b" />
    <circle cx="95" cy="45" r="28" fill="#ffffff" />
    <!-- Camera Icon -->
    <path d="M 85,42 L 88,38 L 102,38 L 105,42 L 109,42 C 111,42 112,43 112,45 L 112,54 C 112,56 111,57 109,57 L 81,57 C 79,57 78,56 78,54 L 78,45 C 78,43 79,42 81,42 Z" fill="#991b1b" />
    <circle cx="95" cy="49" r="5" fill="#ffffff" />
  </g>

  <!-- Typography & Directions -->
  <text x="400" y="420" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="bold" fill="#1c1917">
    Jai Bharat Family Restaurant
  </text>
  <text x="400" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#991b1b">
    NANDIGAMA, ANDHRA PRADESH
  </text>

  <rect x="250" y="475" width="300" height="42" rx="21" fill="#991b1b" fill-opacity="0.08" stroke="#991b1b" stroke-width="1" stroke-opacity="0.25" />
  <text x="400" y="501" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#7f1d1d">
    Restaurant Exterior Photo Slot
  </text>

  <text x="400" y="540" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#78716c">
    Place photograph at: public/images/jai-bharat-building.jpg
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="50%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#991b1b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#bgGrad)" />
  <circle cx="300" cy="300" r="280" fill="url(#glowGrad)" />

  <!-- Subtle Decorative Frame -->
  <rect x="24" y="24" width="552" height="702" rx="20" fill="none" stroke="#44403c" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  <rect x="36" y="36" width="528" height="678" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Corner Ornaments -->
  <path d="M 46 64 L 64 46" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 554 64 L 536 46" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 46 686 L 64 704" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 554 686 L 536 704" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Central Silhouette / Crest -->
  <g transform="translate(300, 290)">
    <!-- Aura Ring -->
    <circle cx="0" cy="0" r="110" fill="#1c1917" stroke="#78350f" stroke-width="2" />
    <circle cx="0" cy="0" r="98" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.6" />

    <!-- Chef / Owner Silhouette Icon -->
    <!-- Head -->
    <circle cx="0" cy="-20" r="34" fill="#a8a29e" />
    <!-- Chef Toque Hat Accent -->
    <path d="M -28 -42 C -32 -68 -15 -85 0 -85 C 15 -85 32 -68 28 -42 Z" fill="#d6d3d1" />
    <path d="M -22 -44 L 22 -44 L 20 -36 L -20 -36 Z" fill="#f59e0b" />
    <circle cx="-16" cy="-68" r="14" fill="#e7e5e4" />
    <circle cx="0" cy="-76" r="16" fill="#f5f5f4" />
    <circle cx="16" cy="-68" r="14" fill="#e7e5e4" />
    
    <!-- Torso / Shoulders -->
    <path d="M -65 65 C -65 25 -38 12 0 12 C 38 12 65 25 65 65 Z" fill="#78716c" />
    <!-- Traditional Collar / Tie -->
    <path d="M -12 12 L 0 38 L 12 12 Z" fill="#991b1b" />
    <circle cx="0" cy="46" r="3" fill="#d97706" />
    <circle cx="0" cy="58" r="3" fill="#d97706" />
  </g>

  <!-- Typography -->
  <!-- Tag -->
  <rect x="180" y="445" width="240" height="28" rx="14" fill="#991b1b" opacity="0.3" stroke="#991b1b" stroke-width="1" />
  <text x="300" y="464" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="3">RESTAURANT OWNER</text>

  <!-- Title -->
  <text x="300" y="520" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Jai Bharat Leadership</text>
  <text x="300" y="548" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a8a29e" text-anchor="middle">Passionate Hospitality &amp; Culinary Care</text>

  <!-- Subtle Helper Note -->
  <g transform="translate(300, 615)">
    <rect x="-180" y="-18" width="360" height="36" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1" />
    <circle cx="-150" cy="0" r="8" fill="#d97706" />
    <text x="-150" y="3" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">✦</text>
    <text x="-135" y="4" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="start">public/images/owner.jpg</text>
    <text x="160" y="4" font-family="system-ui, sans-serif" font-size="10" fill="#78716c" text-anchor="end">Portrait Slot</text>
  </g>

  <!-- Star accents -->
  <text x="300" y="675" font-family="system-ui, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" letter-spacing="4">✦ ✦ ✦</text>
</svg>
